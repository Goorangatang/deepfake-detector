kind = "web"
previewPath = "/"
title = "TrueSource AI"
version = "1.0.0"
id = "artifacts/truesource-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18359

[services.development]
run = "cd /home/runner/workspace/truesource && /home/runner/workspace/.pythonlibs/bin/gunicorn --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT app:app"

[services.production]

[services.production.build]
args = ["sh", "-c", "cd /home/runner/workspace/truesource && /home/runner/workspace/.pythonlibs/bin/python -c \"import json; cfg=json.load(open('model_config.json')); from huggingface_hub import hf_hub_download; [hf_hub_download(repo_id=cfg['hub_repo_id'], filename=f) for f in cfg['hub_files']]; print('Model pre-downloaded successfully')\""]

[services.production.run]
args = ["sh", "-c", "cd /home/runner/workspace/truesource && /home/runner/workspace/.pythonlibs/bin/gunicorn --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT app:app"]

[services.production.run.env]
PORT = "18359"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "18359"
BASE_PATH = "/"
