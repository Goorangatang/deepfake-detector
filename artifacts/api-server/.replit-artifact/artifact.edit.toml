kind = "web"
previewPath = "/"
title = "TrueSource AI"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "TrueSource AI"
paths = ["/"]

[services.env]
PORT = "5000"

[services.development]
run = "cd truesource && PORT=5000 ../.pythonlibs/bin/gunicorn --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:5000 app:app"

[services.production]

[services.production.run]
args = ["sh", "-c", "cd truesource && PORT=5000 ../.pythonlibs/bin/gunicorn --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:5000 app:app"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/api/status"
